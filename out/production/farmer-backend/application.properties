spring.application.name=farmer-backend
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/farmer_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File upload
file.upload-dir=C:/uploads
upload.folder=C:/uploads
max.upload.size=10485760
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.base-url=http://localhost:8080

# JWT
jwt.secret=your-secret-key-change-this-in-prod
jwt.expiration=86400000

# CORS
cors.allowed.origins=http://localhost:5173
